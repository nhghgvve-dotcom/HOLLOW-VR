name: Build HOLLOW for Meta Quest

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.40f1
          targetPlatform: Android
          buildMethod: HollowBuild.BuildAndroid
          buildsPath: build
          versioning: Semantic

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOLLOW-Quest-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
