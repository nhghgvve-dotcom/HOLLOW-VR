name: Request Unity Personal License

on:
  workflow_dispatch:

jobs:
  request-license:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unity activation request
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.40f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: HOLLOW-Unity-Activation-Request
          path: Unity_v6000.0.40f1.alf
          if-no-files-found: error
          retention-days: 1
